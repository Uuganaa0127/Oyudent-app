<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Oyudent">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Oyudent</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Retire Flutter's old offline preview cache without touching session storage.
    (async () => {
      if ('serviceWorker' in navigator) {
        for (const registration of await navigator.serviceWorker.getRegistrations()) {
          const script = registration.active?.scriptURL || registration.waiting?.scriptURL || '';
          if (script && new URL(script).pathname.endsWith('/flutter_service_worker.js')) await registration.unregister();
        }
      }
      if ('caches' in window) {
        for (const key of await caches.keys()) {
          if (['flutter-app-cache', 'flutter-temp-cache', 'flutter-app-manifest'].includes(key)) await caches.delete(key);
        }
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=daily-popup-v3';
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
